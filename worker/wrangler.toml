name = "ttx-brief"
main = "index.js"
compatibility_date = "2026-11-01"

# BOT_TOKEN и CHAT_ID сюда не пишем: это секреты, их задают командой
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
[vars]
ALLOWED_ORIGINS = "https://totktoxam.github.io"
MAX_FILE_MB = "10"

# Не больше 5 заявок в минуту с одного IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
